[package]
name = "the-margin"
version = "0.2.0"
edition = "2021"
description = "Local server for The Margin — serves the page and proxies the messages endpoint."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
